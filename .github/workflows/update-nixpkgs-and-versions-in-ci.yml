name: 🤖🆙❄️
on:
  pull_request:
    paths:
      - '.github/workflows/update-nixpkgs-and-versions-in-ci.yml'
  schedule:
    # Every Monday 10:17 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    uses: kachick/workflows/.github/workflows/reusable-bump-flake-lock.yml@main
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
      post-commit-lock-file: nix develop --command bash -c "ruby -e 'puts RUBY_VERSION' > .ruby-version"
      post-commit-lock-file-title: 'Update .ruby-version'
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
